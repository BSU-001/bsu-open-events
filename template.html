<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postgraduate Open Days and PGCE Open Events | Bath Spa University</title>
<style>
  html, body { margin:0; padding:0; background:transparent; }
  .bsu-events { font-family: Arial, Helvetica, sans-serif; color:#1a1a1a; line-height:1.4;
    display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:20px; }
  .bsu-events .event-block { padding:24px; display:flex; flex-direction:column; }
  .bsu-events .event-block--pg   { background:#F2F8FD; }
  .bsu-events .event-block--pgce { background:#FAF6EA; }
  .bsu-events h3 { font-size:1.4rem; margin:0 0 12px; }
  .bsu-events .event-list { list-style:none; padding:0; margin:0; }
  .bsu-events .event-list li { padding:10px 0; border-bottom:1px solid rgba(0,0,0,.12); }
  .bsu-events .event-list li:first-child { border-top:1px solid rgba(0,0,0,.12); }
  .bsu-events .event-date { display:block; font-weight:700; }
  .bsu-events .event-time { display:block; }
</style>
</head>
<body>
<!-- Generated automatically from https://www.bathspa.ac.uk/open-days/ - edit template.html, not index.html -->
<div class="bsu-events">

  <section class="event-block event-block--pg">
    <h3>{{PG_NAME}}</h3>
    <ul class="event-list">
      {{PG_EVENTS}}
    </ul>
  </section>

  <section class="event-block event-block--pgce">
    <h3>{{PGCE_NAME}}</h3>
    <ul class="event-list">
      {{PGCE_EVENTS}}
    </ul>
  </section>

</div>
</body>
</html>
