<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upcoming Open Days | Bath Spa University</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* The text sizes itself to fit the frame (see the script at the bottom).
     These are the largest and smallest sizes it's allowed to use, in pixels. */
  :root { --max-text: 22px; --min-text: 10px; }
  html, body { margin:0; padding:0; height:100%; background:transparent; overflow:hidden; }
  .open-days-card {
    box-sizing:border-box; width:100%; height:100%;
    overflow:hidden;
    background:#982871; color:#fff;
    border-radius:24px;
    padding:1.5em;
    font-family:"Lexend", "Helvetica Neue", Arial, sans-serif;
  }
  .open-days-card h2 {
    margin:0 0 0.8em; font-weight:500;
    font-size:1.6em; line-height:1.15;
  }
  .open-days-card ul { list-style:none; margin:0; padding:0; }
  .open-days-card li { line-height:1.35; margin:0 0 0.8em; }
  .open-days-card li:last-child { margin-bottom:0; }
</style>
</head>
<body>
<!-- Generated automatically from https://www.bathspa.ac.uk/open-days/ - edit template.html, not index.html -->
<div class="open-days-card">
  <h2>Upcoming Open Days</h2>
  <ul>
      {{EVENTS}}
  </ul>
</div>
<script>
/* Fit the text to the frame: picks the largest size (between --max-text
   and --min-text) at which every event fits without being cut off. */
(function () {
  var card = document.querySelector('.open-days-card');
  var css = getComputedStyle(document.documentElement);
  var max = parseFloat(css.getPropertyValue('--max-text')) || 22;
  var min = parseFloat(css.getPropertyValue('--min-text')) || 10;
  function fits() {
    return card.scrollHeight <= card.clientHeight + 1 && card.scrollWidth <= card.clientWidth + 1;
  }
  function fit() {
    var lo = min, hi = max;
    for (var i = 0; i < 12; i++) {
      var mid = (lo + hi) / 2;
      card.style.fontSize = mid + 'px';
      if (fits()) lo = mid; else hi = mid;
    }
    card.style.fontSize = lo + 'px';
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  window.addEventListener('resize', fit);
})();
</script>
</body>
</html>
