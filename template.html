<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upcoming Open Days | Bath Spa University</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Sizes: change these numbers to make the card text bigger or smaller */
  :root {
    --heading-size: 1.75rem;   /* "Upcoming Open Days" */
    --event-size: 1.05rem;     /* each event line */
    --padding: 32px;           /* space inside the card */
  }
  html, body { margin:0; padding:0; height:100%; background:transparent; }
  .open-days-card {
    box-sizing:border-box; width:100%;
    min-height:100%;            /* fills the iframe height, so it lines up with the box beside it */
    background:#982871; color:#fff;
    border-radius:24px;
    padding:var(--padding);
    font-family:"Lexend", "Helvetica Neue", Arial, sans-serif;
  }
  .open-days-card h2 {
    margin:0 0 20px; font-weight:500;
    font-size:var(--heading-size); line-height:1.15;
  }
  .open-days-card ul { list-style:none; margin:0; padding:0; }
  .open-days-card li {
    font-size:var(--event-size); line-height:1.35;
    margin:0 0 14px;
  }
  .open-days-card li:last-child { margin-bottom:0; }
</style>
</head>
<body>
<!-- Generated automatically from https://www.bathspa.ac.uk/open-days/ - edit template.html, not index.html -->
<div class="open-days-card">
  <h2>Upcoming Open Days</h2>
  <ul>
      {{EVENTS}}
  </ul>
</div>
</body>
</html>
